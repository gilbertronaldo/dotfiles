# ASUS Zenbook 14 OLED UM3406KA - speaker EQ (improved)
# Realtek ALC294 + Cirrus Logic CS35L41 smart-amp
#
# Tujuan: aman untuk speaker tipis + jernih ala "Dolby-like".
# - High-pass 65Hz untuk buang frekuensi yang tidak mampu di-repro speaker
#   laptop (mencegah sember / over-excursion).
# - Bass dibuat konservatif: +2dB, bukan +4dB.
# - Potong sedikit low-mid yang bikin suara "kotak / mendem".
# - Boost presence + air untuk dialog jernih.
# - TANPA target.object hardcoded: ikut default sink otomatis,
#   jadi aman saat pindah ke HDMI / Bluetooth / USB DAC.
#
# Catatan: ini BUKAN Dolby Atmos asli (proprietary Windows-only).
# Lihat penjelasan di chat untuk opsi Atmos di Linux.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Zenbook Speaker EQ"
            media.name       = "Zenbook Speaker EQ"

            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = subsonic_hp
                        label = bq_highpass
                        control = {
                            "Freq" = 65.0
                            "Q"    = 0.70
                        }
                    }
                    {
                        type  = builtin
                        name  = bass_shelf
                        label = bq_lowshelf
                        control = {
                            "Freq" = 90.0
                            "Q"    = 0.70
                            "Gain" = 2.0
                        }
                    }
                    {
                        type  = builtin
                        name  = bass_body
                        label = bq_peaking
                        control = {
                            "Freq" = 150.0
                            "Q"    = 0.90
                            "Gain" = 1.0
                        }
                    }
                    {
                        type  = builtin
                        name  = low_mid
                        label = bq_peaking
                        control = {
                            "Freq" = 350.0
                            "Q"    = 1.00
                            "Gain" = -1.5
                        }
                    }
                    {
                        type  = builtin
                        name  = presence
                        label = bq_peaking
                        control = {
                            "Freq" = 2500.0
                            "Q"    = 0.80
                            "Gain" = 1.5
                        }
                    }
                    {
                        type  = builtin
                        name  = treble
                        label = bq_highshelf
                        control = {
                            "Freq" = 7000.0
                            "Q"    = 0.70
                            "Gain" = 2.0
                        }
                    }
                ]

                links = [
                    { output = "subsonic_hp:Out" input = "bass_shelf:In" }
                    { output = "bass_shelf:Out" input = "bass_body:In" }
                    { output = "bass_body:Out" input = "low_mid:In" }
                    { output = "low_mid:Out" input = "presence:In" }
                    { output = "presence:Out" input = "treble:In" }
                ]
            }

            audio.channels = 2
            audio.position = [ FL FR ]

            capture.props = {
                node.name   = "effect_input.zenbook_eq"
                node.description = "Zenbook Speaker EQ"
                media.class = Audio/Sink
            }

            playback.props = {
                node.name   = "effect_output.zenbook_eq"
                node.description = "Zenbook Speaker EQ Output"
                node.passive = true
                # sengaja TIDAK pakai target.object:
                # biar WirePlumber me-route ke default sink otomatis
            }
        }
    }
]
